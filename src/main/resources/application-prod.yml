spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
      leak-detection-threshold: 20000   # bắt connection bị giữ quá lâu
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    org.springframework.security: INFO

management:
  server:
    port: 9090
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 0.1
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://otel-collector:4318/v1/traces}