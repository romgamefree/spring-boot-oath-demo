spring:
  application:
    name: jte-login
  threads:
    virtual:
      enabled: true
    main:
      keep-alive: true
  jpa:
    open-in-view: false          # tránh giữ connection DB suốt lúc render JTE
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [email, profile]
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: [user:email, read:user]
gg:
  jte:
    developmentMode: true
server:
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# ── AOP Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    # LoggingAspect: thay đổi sang DEBUG để thấy log thời gian thực thi
    dev.danvega.aspect.LoggingAspect: DEBUG
    # PerformanceAspect: DEBUG cho normal, WARN tự động khi chậm
    dev.danvega.aspect.PerformanceAspect: DEBUG
    # Audit log luôn ở INFO để ghi mọi thao tác admin
    AUDIT.dev.danvega.aspect.SecurityAuditAspect: INFO