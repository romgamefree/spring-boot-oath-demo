spring:
  datasource:
    url: jdbc:h2:mem:cmsdb
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy}

gg:
  jte:
    development-mode: true

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG            # thay cho show-sql
    org.hibernate.orm.jdbc.bind: TRACE  # xem tham số bind khi cần

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces